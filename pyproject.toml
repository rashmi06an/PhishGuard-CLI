[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "phishguard"
version = "1.0.0"
description = "PhishGuard-CLI: Intelligent Phishing Domain and Lookalike Detection Terminal Application"
readme = "README.md"
authors = [{ name = "PhishGuard Team" }]
requires-python = ">=3.9"
dependencies = [
    "rich>=13.0.0",
    "rapidfuzz>=3.0.0",
    "scikit-learn>=1.3.0",
    "pandas>=2.0.0",
    "requests>=2.28.0",
    "beautifulsoup4>=4.12.0",
    "tldextract>=5.0.0",
    "joblib>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
phishguard = "phishguard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
